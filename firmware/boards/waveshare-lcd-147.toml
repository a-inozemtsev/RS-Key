#
# Waveshare RP2350-LCD-1.47-A: ST7789V3 172x320 over SPI, no touch controller.
#
# The touch UI (`--features display`) is laid out for 240 columns and needs a finger, so it
# does not build here. This board is the `lcd-confirm` build: the BOOT button stays the
# presence source and the panel shows what the button approves.
#
#   BOARD=waveshare-lcd-147 cargo build --release -p firmware --features lcd-confirm
#
# Pins (schematic RP2350-LCD-1.47-A and the vendor demo's DEV_Config.h, which agree):
#   LCD_DC 16   LCD_CS 17   LCD_CLK 18   LCD_DIN 19   LCD_RST 20   LCD_BL 21
#   WS2812 22 (unused: the build is LED_KIND=none)   SD card 10..15 (unused)
#   Key1 = BOOT (QSPI_SS, the presence button), Key2 = RESET.

[usb]
vidpid = "RSKey"

[led]
# The panel's PIO transport takes PIO0 and DMA_CH0, which the addressable-LED driver also
# wants; the build refuses anything but `none` at compile time.
kind = "none"

[presence]
source = "bootsel"

[flash]
size_mb = 16
kvmain_kb = 1408

[display]
# Exactly half the 160 MHz system clock (checked at compile time): the PIO spends two
# instructions per bit. That is above the vendor demo's 30 MHz and the ST7789V3 datasheet's
# write cycle; if the picture tears or is noisy, the clock plan changes, not just this number.
spi_freq_hz = 80_000_000
# The 172-wide glass sits 34 columns into the controller's 240-column RAM.
width = 172
x_offset = 34
# PIO serial pair; the backlight is PWM slice 2, channel B.
clk = 18
mosi = 19
cs = 17
dc = 16
rst = 20
bl_pin = 21
bl_pwm_slice = 2
bl_pwm_channel = "B"
# The vendor demo sends 0x21 (inversion on) and MADCTL 0x00 (RGB order).
invert_colors = true
color_order = "rgb"
