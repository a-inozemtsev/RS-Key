# ЗАГОТОВКА (не собиралась и не проверялась на плате).
# Положить в RS-Key: firmware/boards/waveshare-lcd-147.toml
#
# Waveshare RP2350-LCD-1.47-A: ST7789V3 172x320 по SPI, без тачскрина.
# Источники пинов: схема RP2350-LCD-1.47-A.pdf и демо RP2350-LCD-1.47.zip
# (C/01-LCD/lib/Config/DEV_Config.h, Python/03-RGB/WS2812B.py), сверены между собой.
#
# Карта пинов платы:
#   LCD_DC   GPIO16     LCD_CS  GPIO17     LCD_CLK GPIO18    LCD_DIN(MOSI) GPIO19
#   LCD_RST  GPIO20     LCD_BL  GPIO21     RGB_IO (WS2812) GPIO22
#   SD: SCLK 10, MOSI 11, MISO 12, D1 13, D2 14, CS 15
#   Key1 = BOOT (QSPI_SS), Key2 = RESET (RUN). Пользовательской кнопки нет.
#
# ВНИМАНИЕ: файл один не заработает. Ключи clk/mosi появились в ветке lcd147-pio-pins
# (~/Projects/RS-Key); без неё прошивка жёстко берёт GPIO10/11. Остальные пункты
# (размер 172x320, присутствие без тача, tp_rst) ещё не сделаны.

[usb]
vidpid = "RSKey"

[led]
# WS2812 на GPIO22 занят отдельно от панели, конфликта с display-сборкой нет,
# но display-сборка требует LED_KIND=none (проверка при компиляции).
kind = "none"

[presence]
# Тача нет. В display-сборке источник присутствия сейчас - тачскрин (main.rs ~1153),
# нужна правка, чтобы подтверждение шло по BOOTSEL.
source = "bootsel"

[flash]
size_mb = 16
kvmain_kb = 1408

[display]
# Должно быть ровно половиной системной частоты 160 МГц (проверка при компиляции),
# поэтому 80 МГц. Это выше, чем в демо Waveshare (30 МГц) и выше паспортных значений
# ST7789V3. Если картинка искажена, придётся менять тактирование, а не только это число.
spi_freq_hz = 80_000_000
# Видимая область 172 из 240 столбцов контроллера: окно сдвигается на 34 столбца.
# Полный тач-UI рассчитан на 240, поэтому с этой платой он не соберётся (assert в main.rs);
# нужна урезанная сборка lcd-confirm.
width = 172
x_offset = 34
# PIO-линия панели: GPIO18 (CLK) и GPIO19 (DIN).
clk = 18
mosi = 19
cs = 17
dc = 16
rst = 20
# Подсветка GPIO21 = PWM slice 2, канал B (комбинация (21, 2, B) есть в main.rs).
bl_pin = 21
bl_pwm_slice = 2
bl_pwm_channel = "B"
# Тача нет. Параметр обязателен для сборки и занимает пин как выход; указан свободный
# GPIO без периферии на плате. Лучше сделать параметр необязательным в коде.
tp_rst = 2
# Кнопки пробуждения нет. В файле плат wake_pin - только число (u8), а по умолчанию 25.
# Отключить можно переменной окружения при сборке: env WAKE_PIN=none (build.rs это поддерживает).
# Демо шлёт команду 0x21 (инверсия включена) и MADCTL 0x00 (порядок RGB).
invert_colors = true
color_order = "rgb"
